<!DOCTYPE html>
<html>
<head>
    <title>Search Lectures</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a href="search.html">Search Lectures</a>
            <a href="tutor.html">Become a Tutor</a>
            <a href="books.html">Books</a>
            <a href="sessions.html">Sessions</a>
            <a href="#" onclick="logout()">Logout</a>
        </nav>
        <h2>Find a Lecture</h2>
        <section>
            <h3>Search by Subject</h3>
            <input id="searchQuery" placeholder="e.g., Math, Programming, History">
            <button onclick="handleSearch()">Search</button>
        </section>
        <section>
            <h3>Search Results</h3>
            <div id="resultsContainer">
                <p>Results will be shown here...</p>
            </div>
        </section>
    </div>
<script>
    const API_BASE_URL = "http://localhost:5000";
    const user = JSON.parse(localStorage.getItem("user"));
    if (!user) { window.location.href = "index.html"; }
    function logout() { localStorage.removeItem("user"); window.location.href = "index.html"; }

    async function handleSearch() {
        const query = document.getElementById("searchQuery").value;
        const resultsContainer = document.getElementById("resultsContainer");
        resultsContainer.innerHTML = "<p>Searching...</p>"; // Show loading message

        if (!query) {
            resultsContainer.innerHTML = "<p>Please enter a subject to search for.</p>";
            return;
        }

        const response = await fetch(`${API_BASE_URL}/listings/search?subject=${encodeURIComponent(query)}`);
        const listings = await response.json();

        if (response.ok) {
            displayResults(listings);
        } else {
            resultsContainer.innerHTML = `<p>Error: ${listings.error}</p>`;
        }
    }

    function displayResults(listings) {
        const resultsContainer = document.getElementById("resultsContainer");
        resultsContainer.innerHTML = ""; // Clear previous results

        if (listings.length === 0) {
            resultsContainer.innerHTML = "<p>No lectures found matching your search.</p>";
            return;
        }

        listings.forEach(listing => {
            const listingCard = document.createElement("div");
            listingCard.style.border = "1px solid #ddd";
            listingCard.style.padding = "15px";
            listingCard.style.marginBottom = "10px";
            listingCard.style.borderRadius = "8px";
            
            listingCard.innerHTML = `
                <h4 style="margin-top: 0; color: #5e3370;">${listing.subject}</h4>
                <p><strong>Tutor:</strong> ${listing.tutor_name} (ID: ${listing.tutor_id})</p>
                <p><strong>Description:</strong> ${listing.description || 'No description provided.'}</p>
                <p><strong>Cost:</strong> ${listing.credits_cost} Credits</p>
            `;
            resultsContainer.appendChild(listingCard);
        });
    }
</script>
</body>
</html>
