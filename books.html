<!DOCTYPE html>
<html>
<head>
    <title>Manage Books</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a href="search.html">Search Lectures</a>
            <a href="tutor.html">Become a Tutor</a>
            <a href="books.html">Books</a>
            <a href="sessions.html">Sessions</a>
            <a href="#" onclick="logout()">Logout</a>
        </nav>
        <h2>Book Exchange</h2>
        <section>
            <h3>Add a New Book</h3>
            <input id="bookTitle" placeholder="Book Title">
            <input id="bookAuthor" placeholder="Author">
            <button onclick="addBook()">Add Book</button>
            <pre id="addBookResult"></pre>
        </section>
        <section>
            <h3>All Available Books</h3>
            <button onclick="getAllBooks()">Refresh Books</button>
            <pre id="allBooksResult"></pre>
        </section>
    </div>
<script>
    const API_BASE_URL = "http://localhost:5000";
    const user = JSON.parse(localStorage.getItem("user"));
    if (!user) { window.location.href = "index.html"; }
    function logout() { localStorage.removeItem("user"); window.location.href = "index.html"; }

    async function addBook() {
        const response = await fetch(`${API_BASE_URL}/books`, {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                title: document.getElementById("bookTitle").value,
                author: document.getElementById("bookAuthor").value,
                owner_id: user.id
            })
        });
        const data = await response.json();
        document.getElementById("addBookResult").innerText = JSON.stringify(data, null, 2);
        getAllBooks();
    }
    async function getAllBooks() {
        const response = await fetch(`${API_BASE_URL}/books`);
        const data = await response.json();
        document.getElementById("allBooksResult").innerText = JSON.stringify(data, null, 2);
    }
    getAllBooks();
</script>
</body>
</html>
